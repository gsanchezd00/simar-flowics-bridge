<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>SIMAR Sargazo Embed</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root {
      --timeline-height: 112px;
      --panel: rgba(2, 18, 29, 0.95);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f4fbff;
      --muted: #91aeba;
      --accent: #19d8f4;
      --latest: #00e46a;
      --danger: #ff6464;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #06131f;
      font-family: Arial, Helvetica, sans-serif;
    }

    /*
     * El documento nunca crea un ancho propio:
     * solo ocupa el rectángulo del iframe de Flowics.
     */
    #embed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #06131f;
    }

    #map {
      position: absolute;
      inset: 0 0 var(--timeline-height) 0;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #06131f;
      touch-action: none;
    }

    #fallback {
      position: absolute;
      inset: 0 0 var(--timeline-height) 0;
      width: 100%;
      height: calc(100% - var(--timeline-height));
      object-fit: cover;
      display: none;
      pointer-events: none;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 54px;
      z-index: 1000;
      max-width: calc(100% - 74px);
      padding: 7px 11px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(2, 17, 28, 0.82);
      color: var(--text);
      font-size: 12px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }

    #status[hidden] {
      display: none;
    }

    #status.error {
      background: rgba(112, 19, 25, 0.9);
    }

    #timeline {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 1100;
      height: var(--timeline-height);
      display: grid;
      grid-template-columns: 294px minmax(0, 1fr);
      overflow: hidden;
      border-top: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
    }

    #timeline[hidden] {
      display: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(5, 36px) minmax(90px, 1fr);
      grid-template-rows: 37px 29px;
      align-content: center;
      align-items: center;
      gap: 4px;
      min-width: 0;
      padding: 8px 10px;
      border-right: 1px solid var(--line);
    }

    .controls button {
      width: 36px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }

    .controls button:hover {
      border-color: rgba(25, 216, 244, 0.75);
      background: rgba(25, 216, 244, 0.13);
    }

    .controls button:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .periodicity {
      grid-column: 1 / span 5;
      grid-row: 2;
      align-self: end;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .date-box {
      grid-column: 6;
      grid-row: 1 / span 2;
      min-width: 0;
      padding-left: 6px;
      overflow: hidden;
    }

    .date-main,
    .date-sub {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .date-main {
      font-size: 13px;
      font-weight: 700;
    }

    .date-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .timeline-view {
      min-width: 0;
      overflow: hidden;
    }

    .months {
      height: 27px;
      display: flex;
      align-items: center;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .month-label {
      flex: 0 0 auto;
      padding-left: 11px;
      overflow: hidden;
      white-space: nowrap;
    }

    .days {
      height: 85px;
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(25, 216, 244, 0.55) transparent;
      scroll-behavior: smooth;
      overscroll-behavior-x: contain;
    }

    .days::-webkit-scrollbar {
      height: 5px;
    }

    .days::-webkit-scrollbar-thumb {
      border-radius: 20px;
      background: rgba(25, 216, 244, 0.55);
    }

    .day {
      position: relative;
      flex: 0 0 46px;
      height: 78px;
      padding: 13px 3px 6px;
      border: 0;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .day:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .day.selected {
      background: rgba(25, 216, 244, 0.17);
      color: #fff;
      box-shadow: inset 0 3px 0 var(--accent);
    }

    .day.latest::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--latest);
    }

    .day.unavailable {
      color: rgba(145, 174, 186, 0.34);
      text-decoration: line-through;
    }

    .day.future {
      opacity: 0.24;
      cursor: default;
    }

    .day-number {
      display: block;
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
    }

    .day-name {
      display: block;
      margin-top: 7px;
      font-size: 9px;
      text-transform: uppercase;
    }

    .month-divider {
      border-left: 2px solid rgba(25, 216, 244, 0.52);
    }

    .leaflet-control-zoom,
    .leaflet-bar {
      border: 0 !important;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.32) !important;
    }

    .leaflet-control-attribution {
      background: rgba(255, 255, 255, 0.74) !important;
      font-size: 9px !important;
    }

    @media (max-width: 720px) {
      :root {
        --timeline-height: 142px;
      }

      #timeline {
        grid-template-columns: 1fr;
        grid-template-rows: 58px 84px;
      }

      .controls {
        grid-template-columns: repeat(5, 34px) 1fr;
        grid-template-rows: 31px 18px;
        padding: 5px 8px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .controls button {
        width: 34px;
        height: 29px;
      }

      .months {
        height: 22px;
      }

      .days {
        height: 62px;
      }

      .day {
        height: 58px;
        padding-top: 9px;
      }

      .day-name {
        margin-top: 4px;
      }
    }
  </style>
</head>

<body>
  <main id="embed">
    <img
      id="fallback"
      src="./latest.jpg"
      alt="Captura de respaldo del mapa SIMAR"
    >

    <div id="map"></div>
    <div id="status" aria-live="polite">Cargando sargazo SIMAR…</div>

    <section id="timeline" aria-label="Línea de tiempo del sargazo">
      <div class="controls">
        <button id="olderWindow" title="Treinta días anteriores">«</button>
        <button id="previousDay" title="Día anterior">‹</button>
        <button id="playPause" title="Reproducir">▶</button>
        <button id="nextDay" title="Día siguiente">›</button>
        <button id="newerWindow" title="Treinta días posteriores">»</button>

        <div class="periodicity">Periodicidad: diario</div>

        <div class="date-box">
          <div id="selectedDate" class="date-main">—</div>
          <div id="productName" class="date-sub">Mean-AFAI · 7 días</div>
        </div>
      </div>

      <div class="timeline-view">
        <div id="months" class="months"></div>
        <div id="days" class="days"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    const COMPOSITION = "mean-7day-afai";
    const API_ENDPOINT =
      "https://dashboard-simar.conabio.gob.mx/api/raster-layer/";

    const DEFAULTS = {
      zoom: 5,
      centerx: -89.5,
      centery: 20.5,
      maptype: 4,
      showmenu: true,
      showtimeline: true,
      showstatus: false,
      remember: false,
      refreshhours: 14,
      followlatest: true
    };

    function parseBoolean(value, fallback) {
      if (value === undefined || value === null || value === "") {
        return fallback;
      }

      return !["false", "0", "no", "off"].includes(
        String(value).toLowerCase()
      );
    }

    function parseNumber(value, fallback, min, max) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return fallback;
      }

      return Math.min(max, Math.max(min, number));
    }

    /*
     * Acepta parámetros normales:
     * ?zoom=5&centerx=-89.5&centery=20.5
     *
     * También acepta estilo MarineTraffic en el hash:
     * #zoom:5/maptype:4/centerx:-89.5/centery:20.5/remember:false
     */
    function readParameters() {
      const search = new URLSearchParams(window.location.search);
      const hashValues = {};

      String(window.location.hash || "")
        .replace(/^#/, "")
        .split("/")
        .filter(Boolean)
        .forEach(part => {
          const separator = part.indexOf(":");

          if (separator > 0) {
            const key = decodeURIComponent(part.slice(0, separator));
            const value = decodeURIComponent(part.slice(separator + 1));
            hashValues[key.toLowerCase()] = value;
          }
        });

      function value(name) {
        return search.has(name)
          ? search.get(name)
          : hashValues[name.toLowerCase()];
      }

      return {
        zoom: parseNumber(value("zoom"), DEFAULTS.zoom, 3, 12),
        centerx: parseNumber(value("centerx"), DEFAULTS.centerx, -180, 180),
        centery: parseNumber(value("centery"), DEFAULTS.centery, -80, 80),
        maptype: parseNumber(value("maptype"), DEFAULTS.maptype, 1, 4),
        showmenu: parseBoolean(value("showmenu"), DEFAULTS.showmenu),
        showtimeline: parseBoolean(
          value("showtimeline"),
          DEFAULTS.showtimeline
        ),
        showstatus: parseBoolean(value("showstatus"), DEFAULTS.showstatus),
        remember: parseBoolean(value("remember"), DEFAULTS.remember),
        refreshhours: parseNumber(
          value("refreshhours"),
          DEFAULTS.refreshhours,
          1,
          72
        ),
        followlatest: parseBoolean(
          value("followlatest"),
          DEFAULTS.followlatest
        )
      };
    }

    const CONFIG = readParameters();
    const STORAGE_KEY = "simar-flowics-map-view-v1";
    const WINDOW_BEFORE = 34;
    const WINDOW_AFTER = 15;
    const PLAY_INTERVAL_MS = 1800;
    const REFRESH_INTERVAL_MS = CONFIG.refreshhours * 60 * 60 * 1000;

    function readRememberedView() {
      if (!CONFIG.remember) {
        return null;
      }

      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

        if (
          parsed &&
          Number.isFinite(parsed.lat) &&
          Number.isFinite(parsed.lng) &&
          Number.isFinite(parsed.zoom)
        ) {
          return parsed;
        }
      } catch {}

      return null;
    }

    const rememberedView = readRememberedView();

    const INITIAL_VIEW = {
      center: rememberedView
        ? [rememberedView.lat, rememberedView.lng]
        : [CONFIG.centery, CONFIG.centerx],
      zoom: rememberedView ? rememberedView.zoom : CONFIG.zoom
    };

    const state = {
      latestDate: null,
      selectedDate: null,
      windowCenter: null,
      layer: null,
      cache: new Map(),
      unavailable: new Set(),
      playing: false,
      playTimer: null,
      requestToken: 0
    };

    const embed = document.getElementById("embed");
    const fallback = document.getElementById("fallback");
    const status = document.getElementById("status");
    const timeline = document.getElementById("timeline");
    const selectedDateElement = document.getElementById("selectedDate");
    const productNameElement = document.getElementById("productName");
    const monthsElement = document.getElementById("months");
    const daysElement = document.getElementById("days");

    const olderWindowButton = document.getElementById("olderWindow");
    const previousDayButton = document.getElementById("previousDay");
    const playPauseButton = document.getElementById("playPause");
    const nextDayButton = document.getElementById("nextDay");
    const newerWindowButton = document.getElementById("newerWindow");

    status.hidden = !CONFIG.showstatus;
    timeline.hidden = !CONFIG.showtimeline;

    if (!CONFIG.showtimeline) {
      document.documentElement.style.setProperty("--timeline-height", "0px");
    }

    const MAP_LIMITS = L.latLngBounds(
      L.latLng(-12, -145),
      L.latLng(55, -35)
    );

    const map = L.map("map", {
      center: INITIAL_VIEW.center,
      zoom: INITIAL_VIEW.zoom,
      minZoom: 3,
      maxZoom: 12,
      zoomControl: CONFIG.showmenu,
      dragging: true,
      touchZoom: true,
      scrollWheelZoom: true,
      doubleClickZoom: true,
      boxZoom: true,
      keyboard: false,
      worldCopyJump: false,
      maxBounds: MAP_LIMITS,
      maxBoundsViscosity: 1,
      inertia: false,
      zoomAnimation: false,
      fadeAnimation: false,
      markerZoomAnimation: false,
      preferCanvas: true
    });

    const imagery = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "Mapa base: Esri"
      }
    );

    const streets = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }
    );

    if (CONFIG.maptype === 4) {
      imagery.addTo(map);
    } else {
      streets.addTo(map);
    }

    if (CONFIG.showmenu) {
      const HomeControl = L.Control.extend({
        options: { position: "topleft" },

        onAdd() {
          const container = L.DomUtil.create("div", "leaflet-bar");
          const button = L.DomUtil.create("a", "", container);

          button.href = "#";
          button.title = "Regresar a la vista inicial";
          button.setAttribute("role", "button");
          button.setAttribute("aria-label", "Regresar a la vista inicial");
          button.innerHTML = "⌂";
          button.style.fontSize = "21px";
          button.style.fontWeight = "700";

          L.DomEvent.disableClickPropagation(container);
          L.DomEvent.disableScrollPropagation(container);

          L.DomEvent.on(button, "click", event => {
            L.DomEvent.preventDefault(event);
            map.setView(INITIAL_VIEW.center, INITIAL_VIEW.zoom, {
              animate: false
            });
          });

          return container;
        }
      });

      map.addControl(new HomeControl());
    }

    /*
     * El mapa vive dentro de un iframe de Flowics.
     * No toca estilos, dimensiones ni posiciones del documento padre.
     */
    map.on("moveend zoomend", () => {
      if (!CONFIG.remember) {
        return;
      }

      const center = map.getCenter();

      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            lat: center.lat,
            lng: center.lng,
            zoom: map.getZoom()
          })
        );
      } catch {}
    });

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function isoDate(date) {
      const year = date.getUTCFullYear();
      const month = String(date.getUTCMonth() + 1).padStart(2, "0");
      const day = String(date.getUTCDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseDate(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day, 12, 0, 0));
    }

    function addDays(dateString, amount) {
      const date = parseDate(dateString);
      date.setUTCDate(date.getUTCDate() + amount);
      return isoDate(date);
    }

    function compareDates(a, b) {
      return parseDate(a).getTime() - parseDate(b).getTime();
    }

    function formatFullDate(dateString) {
      return new Intl.DateTimeFormat("es-MX", {
        weekday: "short",
        day: "2-digit",
        month: "short",
        year: "numeric",
        timeZone: "America/Mexico_City"
      }).format(parseDate(dateString));
    }

    function formatMonth(dateString) {
      return new Intl.DateTimeFormat("es-MX", {
        month: "long",
        year: "numeric",
        timeZone: "America/Mexico_City"
      }).format(parseDate(dateString));
    }

    function weekdayShort(dateString) {
      return new Intl.DateTimeFormat("es-MX", {
        weekday: "short",
        timeZone: "America/Mexico_City"
      })
        .format(parseDate(dateString))
        .replace(".", "");
    }

    function dayNumber(dateString) {
      return String(parseDate(dateString).getUTCDate());
    }

    function monthKey(dateString) {
      return dateString.slice(0, 7);
    }

    function buildDateRange(centerDate) {
      const dates = [];

      for (let offset = -WINDOW_BEFORE; offset <= WINDOW_AFTER; offset += 1) {
        dates.push(addDays(centerDate, offset));
      }

      return dates;
    }

    function findLatestDateFromRequests(data) {
      if (!data || !Array.isArray(data.requests)) {
        return null;
      }

      const dates = data.requests
        .map(item => {
          const match = String(item?.url || "").match(
            /mean-7day-afai\/[^/]+\/(\d{4}-\d{2}-\d{2})\/wmts/i
          );

          return match ? match[1] : null;
        })
        .filter(Boolean)
        .sort();

      return dates.length ? dates[dates.length - 1] : null;
    }

    function renderMonthLabels(dates) {
      monthsElement.innerHTML = "";

      const groups = [];
      let current = null;

      for (const date of dates) {
        const key = monthKey(date);

        if (!current || current.key !== key) {
          current = {
            key,
            firstDate: date,
            days: 0
          };

          groups.push(current);
        }

        current.days += 1;
      }

      for (const group of groups) {
        const label = document.createElement("span");
        label.className = "month-label";
        label.textContent = formatMonth(group.firstDate);
        label.style.width = `${group.days * 46}px`;
        monthsElement.appendChild(label);
      }
    }

    function renderTimeline() {
      if (!CONFIG.showtimeline) {
        return;
      }

      const center = state.windowCenter || state.selectedDate || state.latestDate;

      if (!center) {
        return;
      }

      const dates = buildDateRange(center);

      daysElement.innerHTML = "";
      renderMonthLabels(dates);

      dates.forEach((date, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "day";
        button.dataset.date = date;
        button.title = formatFullDate(date);

        if (index > 0 && monthKey(date) !== monthKey(dates[index - 1])) {
          button.classList.add("month-divider");
        }

        if (date === state.selectedDate) {
          button.classList.add("selected");
        }

        if (date === state.latestDate) {
          button.classList.add("latest");
        }

        if (state.unavailable.has(date)) {
          button.classList.add("unavailable");
        }

        if (state.latestDate && compareDates(date, state.latestDate) > 0) {
          button.classList.add("future");
          button.disabled = true;
        }

        const number = document.createElement("span");
        number.className = "day-number";
        number.textContent = dayNumber(date);

        const weekday = document.createElement("span");
        weekday.className = "day-name";
        weekday.textContent = weekdayShort(date);

        button.append(number, weekday);

        button.addEventListener("click", () => {
          stopPlayback();
          loadProductDate(date, { centerInTimeline: false });
        });

        daysElement.appendChild(button);
      });

      requestAnimationFrame(() => {
        const selected = daysElement.querySelector(
          `[data-date="${state.selectedDate}"]`
        );

        if (selected) {
          selected.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "center"
          });
        }
      });
    }

    async function fetchProduct(dateString) {
      if (state.cache.has(dateString)) {
        return state.cache.get(dateString);
      }

      const url =
        `${API_ENDPOINT}?composition=${encodeURIComponent(COMPOSITION)}` +
        `&product_date=${encodeURIComponent(dateString)}`;

      const response = await fetch(url, {
        cache: "no-store",
        mode: "cors"
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const payload = await response.json();

      const product =
        payload?.success && payload?.response?.url
          ? payload.response
          : null;

      state.cache.set(dateString, product);

      if (!product) {
        state.unavailable.add(dateString);
      }

      return product;
    }

    function replaceRasterLayer(product) {
      const center = map.getCenter();
      const zoom = map.getZoom();

      if (state.layer) {
        map.removeLayer(state.layer);
      }

      const cacheVersion = encodeURIComponent(
        `${product.product_date}-${Date.now()}`
      );

      state.layer = L.tileLayer(`${product.url}?v=${cacheVersion}`, {
        minZoom: 3,
        maxZoom: 12,
        opacity: 0.92,
        tileSize: 256,
        noWrap: true,
        crossOrigin: false,
        attribution: "Sargazo: SIMAR–CONABIO"
      });

      state.layer.addTo(map);

      /*
       * Cambiar fecha o actualizar datos jamás reinicia
       * el zoom ni el movimiento elegido por el operador.
       */
      map.setView(center, zoom, { animate: false });
      fallback.style.display = "none";
    }

    async function loadProductDate(
      dateString,
      { centerInTimeline = true, silent = false } = {}
    ) {
      if (state.latestDate && compareDates(dateString, state.latestDate) > 0) {
        return false;
      }

      const token = ++state.requestToken;

      if (!silent) {
        setStatus(`Consultando ${formatFullDate(dateString)}…`);
      }

      try {
        const product = await fetchProduct(dateString);

        if (token !== state.requestToken) {
          return false;
        }

        if (!product) {
          state.unavailable.add(dateString);
          renderTimeline();
          setStatus(
            `No hay producto disponible para ${formatFullDate(dateString)}.`,
            true
          );
          return false;
        }

        replaceRasterLayer(product);

        state.selectedDate = product.product_date || dateString;

        if (centerInTimeline) {
          state.windowCenter = state.selectedDate;
        }

        selectedDateElement.textContent = formatFullDate(state.selectedDate);
        productNameElement.textContent = "Mean-AFAI · promedio de 7 días";

        renderTimeline();
        setStatus(`Sargazo SIMAR · ${formatFullDate(state.selectedDate)}`);

        return true;
      } catch (error) {
        console.error(error);
        renderTimeline();
        setStatus(
          `No se pudo consultar ${formatFullDate(dateString)}.`,
          true
        );
        return false;
      }
    }

    async function moveByDay(direction) {
      if (!state.selectedDate) {
        return;
      }

      let candidate = addDays(state.selectedDate, direction);

      for (let attempts = 0; attempts < 12; attempts += 1) {
        if (
          state.latestDate &&
          compareDates(candidate, state.latestDate) > 0
        ) {
          stopPlayback();
          return;
        }

        const loaded = await loadProductDate(candidate, {
          centerInTimeline: false,
          silent: state.playing
        });

        if (loaded) {
          return;
        }

        candidate = addDays(candidate, direction);
      }

      stopPlayback();
    }

    function stopPlayback() {
      state.playing = false;

      if (state.playTimer) {
        clearInterval(state.playTimer);
        state.playTimer = null;
      }

      playPauseButton.textContent = "▶";
      playPauseButton.title = "Reproducir";
    }

    function startPlayback() {
      if (!state.selectedDate) {
        return;
      }

      state.playing = true;
      playPauseButton.textContent = "Ⅱ";
      playPauseButton.title = "Pausar";

      state.playTimer = setInterval(async () => {
        if (state.playing) {
          await moveByDay(1);
        }
      }, PLAY_INTERVAL_MS);
    }

    playPauseButton.addEventListener("click", () => {
      if (state.playing) {
        stopPlayback();
      } else {
        startPlayback();
      }
    });

    previousDayButton.addEventListener("click", async () => {
      stopPlayback();
      await moveByDay(-1);
    });

    nextDayButton.addEventListener("click", async () => {
      stopPlayback();
      await moveByDay(1);
    });

    olderWindowButton.addEventListener("click", () => {
      stopPlayback();
      state.windowCenter = addDays(state.windowCenter, -30);
      renderTimeline();
    });

    newerWindowButton.addEventListener("click", () => {
      stopPlayback();

      const proposed = addDays(state.windowCenter, 30);

      state.windowCenter =
        compareDates(proposed, state.latestDate) > 0
          ? state.latestDate
          : proposed;

      renderTimeline();
    });

    async function fetchRequestData() {
      const response = await fetch(
        `./requests.json?t=${Date.now()}`,
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error(`requests.json HTTP ${response.status}`);
      }

      return response.json();
    }

    async function refreshLatestData() {
      try {
        const viewCenter = map.getCenter();
        const viewZoom = map.getZoom();
        const previousLatest = state.latestDate;
        const wasFollowingLatest =
          !state.selectedDate || state.selectedDate === previousLatest;

        const requestData = await fetchRequestData();
        const newestDate = findLatestDateFromRequests(requestData);

        if (!newestDate) {
          return;
        }

        state.latestDate = newestDate;
        state.cache.delete(newestDate);

        if (
          CONFIG.followlatest &&
          wasFollowingLatest &&
          newestDate !== previousLatest
        ) {
          await loadProductDate(newestDate, {
            centerInTimeline: true,
            silent: true
          });
        } else {
          renderTimeline();
        }

        /*
         * La actualización de 14 horas cambia datos,
         * pero conserva exactamente la vista del operador.
         */
        map.setView(viewCenter, viewZoom, { animate: false });
      } catch (error) {
        console.warn("Actualización automática:", error);
      }
    }

    async function initialize() {
      try {
        const requestData = await fetchRequestData();
        const latest = findLatestDateFromRequests(requestData);

        if (!latest) {
          throw new Error("No se encontró la fecha más reciente");
        }

        state.latestDate = latest;
        state.selectedDate = latest;
        state.windowCenter = latest;

        renderTimeline();

        const loaded = await loadProductDate(latest, {
          centerInTimeline: true
        });

        if (!loaded) {
          throw new Error("No se pudo cargar el producto reciente");
        }
      } catch (error) {
        console.error(error);

        fallback.src = `./latest.jpg?t=${Date.now()}`;
        fallback.style.display = "block";

        setStatus(
          "No se pudo iniciar el mapa. Se muestra la captura de respaldo.",
          true
        );
      }
    }

    window.addEventListener("resize", () => {
      map.invalidateSize({ animate: false });
    });

    initialize();

    setTimeout(() => {
      map.invalidateSize({ animate: false });
    }, 400);

    setInterval(refreshLatestData, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
